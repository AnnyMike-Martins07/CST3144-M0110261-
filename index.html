<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="mydiv">


        <div v-if="!displayCart">
            <div v-for="lesson in lessons" :key="lesson.id">
        <h3>Subject: {{lesson.subject}}</h3>
        <p>Location: {{lesson.location}}</p>
        <p>Price: Rs {{lesson.price}}</p>
        <p>Available slots: {{lesson.available}}</p>
        <img :src="lesson.imagePath"
             style="width:200px;"
             :alt="lesson.imageAlt" />
        

        <button @click="addToCart(lesson)"
                :disabled="!canAddToCart(lesson)">Add To Cart</button>
        </div>
        <p>Cart Items: {{cart}}</p>

        </div>

        <button @click="toggleCart" :disabled="numberOfItems=== 0">
            Checkout({{numberOfItems}})
        </button>

        <div v-else>
        <h3>Checkout</h3>
        <p>Cart Items: {{cart}}</p>
        </div>

        
        
    </div>
    <script type="module">
        const {createApp} = Vue;
        createApp({
            data() {
                return {
                   lessons: [
                    {id:1001,
                        subject: "Computer Science",
                        location: "Hendon",
                        price: 700,
                        available: 5,
                        imagePath:"images/computer science lesson.jpg",
                        imageAlt: "Computer Science Lesson"
                    },

                    {
                        id: 1002,
                        subject:"Mathematics",
                        location: "Lagos, Nigeria",
                        price: 1000,
                        available: 5,
                        imagePath: "images/mathematics lesson for coursework.jpg",
                        imageAlt: "Mathematics Lesson"
                    },

                    {
                        id:1003,
                        subject: "English Language",
                        location: "Heathrow, London",
                        price: 1500,
                        available: 5,
                        imagePath: "images/english language picture for coursework.jpg",
                        imageAlt: "English Language Lesson"
                    },
                      

                ],
                       cart: [],
                    displayCart: false

                }
            },

            methods: {
                addToCart(lesson){
                    this.cart.push(lesson.id);
                    lesson.available = lesson.available - 1;
                },
                
                toggleCart() {
                this.displayCart = !this.displayCart;
            },

            
                canAddToCart(lesson) {
                    return lesson.available > 0;
                },
            },
        

            computed: {
                numberOfItems() {
                    return this.cart.length;
                }

            }
        }).mount('#mydiv')
    </script>
</body>
</html>
